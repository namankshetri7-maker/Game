<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Cosmic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- App Icon Gloss Highlight -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Star Character Golden Gradient -->
    <linearGradient id="starGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Star 3D Bevel Dark Gradient -->
    <linearGradient id="starShadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Planetary Orbital Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Rocket Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Rocket Body Gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadow Filter for Star Mascot -->
    <filter id="mascotShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.65" />
    </filter>

    <!-- Glow Filter for Sparkles -->
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  <!-- Gloss Overlay -->
  <rect width="512" height="260" rx="118" fill="url(#glossGrad)" />
  <!-- Crisp Inner Border Rim -->
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="#ffffff" stroke-width="5" stroke-opacity="0.25" />

  <!-- Cosmic Background Glow Nebula -->
  <circle cx="256" cy="270" r="180" fill="#7c3aed" opacity="0.35" />
  <circle cx="340" cy="180" r="120" fill="#0284c7" opacity="0.25" />

  <!-- Background Planetary Orbit Rings (Behind Mascot) -->
  <ellipse cx="256" cy="276" rx="210" ry="74" fill="none" stroke="url(#orbitGrad)" stroke-width="16" transform="rotate(-22 256 276)" stroke-linecap="round" opacity="0.85" />
  <ellipse cx="256" cy="276" rx="198" ry="68" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(-22 256 276)" opacity="0.4" />

  <!-- Orbiting Colorful Mini Planets -->
  <!-- Emerald World Planet -->
  <circle cx="95" cy="330" r="20" fill="#10b981" stroke="#ffffff" stroke-width="3.5" />
  <path d="M 85 330 Q 95 322 105 330" fill="none" stroke="#34d399" stroke-width="3" />
  <!-- Coral Atlas Planet -->
  <circle cx="430" cy="220" r="15" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />

  <!-- Central Super Star Mascot (Front Layer with 3D Shadow) -->
  <g filter="url(#mascotShadow)">
    <!-- 3D Base Star Shape -->
    <polygon
      points="256,92 294,188 398,194 316,260 344,362 256,306 168,362 196,260 114,194 218,188"
      fill="url(#starGrad)"
      stroke="url(#starShadowGrad)"
      stroke-width="10"
      stroke-linejoin="round"
    />

    <!-- Star Golden Inner Facet Accents (3D Depth) -->
    <polygon points="256,92 256,306 168,362 196,260 114,194 218,188" fill="#f59e0b" opacity="0.28" />

    <!-- Explorer Golden Adventure Crown / Goggles Headband -->
    <path d="M 210 186 C 230 178 282 178 302 186" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round" />
    <path d="M 210 186 C 230 178 282 178 302 186" fill="none" stroke="#fef08a" stroke-width="3.5" stroke-linecap="round" />
    <!-- Crown Jewel Diamond -->
    <polygon points="256,168 266,178 256,188 246,178" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />

    <!-- Cute Big Anime Eyes -->
    <!-- Left Eye -->
    <ellipse cx="228" cy="234" rx="15" ry="19" fill="#1e1b4b" />
    <circle cx="233" cy="226" r="7" fill="#ffffff" />
    <circle cx="224" cy="242" r="3" fill="#ffffff" />
    <ellipse cx="230" cy="238" rx="10" ry="12" fill="#3b82f6" opacity="0.25" />

    <!-- Right Eye -->
    <ellipse cx="284" cy="234" rx="15" ry="19" fill="#1e1b4b" />
    <circle cx="289" cy="226" r="7" fill="#ffffff" />
    <circle cx="280" cy="242" r="3" fill="#ffffff" />
    <ellipse cx="286" cy="238" rx="10" ry="12" fill="#3b82f6" opacity="0.25" />

    <!-- Cheerful Big Smile with Pink Tongue -->
    <path d="M 234 262 Q 256 288 278 262" fill="#dc2626" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <path d="M 244 274 Q 256 284 268 274" fill="#fb7185" />

    <!-- Rosy Peachy Glowing Cheeks -->
    <ellipse cx="206" cy="254" rx="13" ry="8" fill="#fb7185" opacity="0.75" />
    <ellipse cx="306" cy="254" rx="13" ry="8" fill="#fb7185" opacity="0.75" />
  </g>

  <!-- Energetic Mini Rocket Zooming Upward (Top-Right Quest Theme) -->
  <g transform="translate(360, 65) rotate(42)" filter="url(#mascotShadow)">
    <!-- Rocket Exhaust Plume / Flame -->
    <polygon points="18,52 30,86 42,52" fill="url(#flameGrad)" />
    <polygon points="24,52 30,72 36,52" fill="#ffffff" />

    <!-- Rocket Wings -->
    <path d="M 12 40 L 0 54 L 14 50 Z" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <path d="M 48 40 L 60 54 L 46 50 Z" fill="#0284c7" stroke="#ffffff" stroke-width="2" />

    <!-- Rocket Main Fuselage -->
    <path d="M 16 22 Q 16 48 18 52 L 42 52 Q 44 48 44 22 Q 30 0 16 22 Z" fill="url(#rocketBody)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Rocket Red Nose Cone -->
    <path d="M 19 18 Q 30 0 41 18 Z" fill="#ef4444" />

    <!-- Rocket Porthole Window -->
    <circle cx="30" cy="30" r="7" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <circle cx="32" cy="28" r="2.5" fill="#ffffff" />
  </g>

  <!-- Magical Sparkles & Stardust Constellations -->
  <g filter="url(#sparkleGlow)">
    <!-- Big 4-Point Golden Sparkle (Top Left) -->
    <path d="M 96 120 Q 96 142 74 142 Q 96 142 96 164 Q 96 142 118 142 Q 96 142 96 120 Z" fill="#fef08a" stroke="#ffffff" stroke-width="1.5" />

    <!-- Medium 4-Point Sparkle (Bottom Right) -->
    <path d="M 390 380 Q 390 396 374 396 Q 390 396 390 412 Q 390 396 406 396 Q 390 396 390 380 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

    <!-- Tiny Diamond Stardust Stars -->
    <polygon points="160,86 164,96 174,96 166,102 169,112 160,106 151,112 154,102 146,96 156,96" fill="#fef08a" />
    <polygon points="410,310 413,318 421,318 415,323 417,331 410,326 403,331 405,323 399,318 407,318" fill="#fbcfe8" />
    <polygon points="140,400 143,408 151,408 145,413 147,421 140,416 133,421 135,413 129,408 137,408" fill="#fef08a" />
  </g>
</svg>
