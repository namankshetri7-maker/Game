<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="150" fill="#1e1b4b" opacity="0.6" />
  <!-- Planetary Ring -->
  <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="url(#ring)" stroke-width="24" transform="rotate(-25 256 256)" opacity="0.85" />
  <!-- Star Character -->
  <polygon points="256,120 288,206 376,210 306,264 332,350 256,300 180,350 206,264 136,210 224,206" fill="url(#star)" stroke="#b45309" stroke-width="8" stroke-linejoin="round" />
  <!-- Cute Eyes -->
  <circle cx="236" cy="226" r="10" fill="#1e293b" />
  <circle cx="276" cy="226" r="10" fill="#1e293b" />
  <circle cx="240" cy="222" r="3.5" fill="white" />
  <circle cx="280" cy="222" r="3.5" fill="white" />
  <!-- Smile -->
  <path d="M 240 248 Q 256 264 272 248" fill="none" stroke="#1e293b" stroke-width="6" stroke-linecap="round" />
  <!-- Rosy cheeks -->
  <circle cx="224" cy="242" r="8" fill="#f43f5e" opacity="0.6" />
  <circle cx="288" cy="242" r="8" fill="#f43f5e" opacity="0.6" />
  <!-- Sparkles -->
  <circle cx="100" cy="110" r="12" fill="#fef08a" />
  <circle cx="410" cy="140" r="16" fill="#fef08a" />
  <circle cx="390" cy="390" r="10" fill="#38bdf8" />
</svg>
